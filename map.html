<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Miracle74 Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;

      background: #111;
      color: white;

      font-family: Arial, sans-serif;
    }

    #toolbar {
      height: 50px;

      display: flex;
      align-items: center;

      gap: 12px;

      padding: 0 15px;

      box-sizing: border-box;

      background: #1a1a1a;

      position: relative;
      z-index: 1000;
    }

    #map {
      width: 100%;
      height: calc(100% - 50px);

      background: #000;
    }

    select,
    button {
      background: #222;
      color: white;

      border: 1px solid #555;

      padding: 6px 10px;

      cursor: pointer;
    }

    button:hover,
    select:hover {
      background: #333;
    }

    #coords {
      margin-left: auto;
      font-family: monospace;
    }

    a {
      color: #00d4ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    /*
      KLUCZOWE:
      nearest-neighbor / brak blur
    */

    .leaflet-image-layer {
      image-rendering: crisp-edges !important;
      image-rendering: pixelated !important;
    }

    .leaflet-pane img {
      image-rendering: crisp-edges !important;
      image-rendering: pixelated !important;
    }

    .leaflet-container {
      background: #000;
    }
  </style>
</head>

<body>

  <div id="toolbar">

    <a href="./index.html">
      ← Wiki
    </a>

    <label for="floorSelect">
      Floor:
    </label>

    <select id="floorSelect"></select>

    <button id="prevFloor">
      -
    </button>

    <button id="nextFloor">
      +
    </button>

    <div id="coords">
      x: -, y: -, z: -
    </div>

  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map;
    let overlay;

    let meta;
    let currentFloor;

    const floorSelect =
      document.getElementById("floorSelect");

    const coords =
      document.getElementById("coords");


    async function init() {

      const response =
        await fetch("./export/map_info.json");

      if (!response.ok) {
        throw new Error(
          "Cannot load ./export/map_info.json"
        );
      }

      meta = await response.json();


      const floors =
        Object.keys(meta.floors)
          .map(Number)
          .sort((a, b) => a - b);


      /*
        Leaflet Simple CRS.

        Ważne:
        zoomSnap = 1
        zoomDelta = 1

        Dzięki temu zoom idzie:
        1x
        2x
        4x
        8x
        16x

        zamiast pośrednich skal powodujących blur.
      */

      map = L.map("map", {

        crs: L.CRS.Simple,

        minZoom: -4,
        maxZoom: 10,

        zoomSnap: 1,
        zoomDelta: 1,

        wheelPxPerZoomLevel: 120,

        zoomAnimation: false,
        fadeAnimation: false,
        markerZoomAnimation: false,

        attributionControl: false

      });


      /*
        Dodanie floorów do selecta.
      */

      floors.forEach(z => {

        const option =
          document.createElement("option");

        option.value = z;

        option.textContent =
          `Floor ${z}`;

        floorSelect.appendChild(option);

      });


      /*
        Domyślnie floor 7.
      */

      currentFloor =
        floors.includes(7)
          ? 7
          : floors[0];

      floorSelect.value =
        currentFloor;


      function getFloorMeta(z) {

        return meta.floors[String(z)];

      }


      function getBounds(z) {

        const floor =
          getFloorMeta(z);

        return [
          [0, 0],
          [
            floor.height,
            floor.width
          ]
        ];

      }


      function applyPixelRendering() {

        if (!overlay) {
          return;
        }

        const image =
          overlay.getElement();

        if (!image) {
          return;
        }

        image.style.imageRendering =
          "pixelated";

        /*
          Dodatkowo wyłączamy
          potencjalne transition.
        */

        image.style.transition =
          "none";

        image.style.willChange =
          "transform";
      }


      function loadFloor(
        z,
        fit = false
      ) {

        currentFloor =
          Number(z);

        const floor =
          getFloorMeta(
            currentFloor
          );

        const bounds =
          getBounds(
            currentFloor
          );


        if (overlay) {

          map.removeLayer(
            overlay
          );

          overlay = null;

        }


        overlay =
          L.imageOverlay(

            `./export/${floor.file}`,

            bounds,

            {
              interactive: false,
              opacity: 1
            }

          );


        overlay.addTo(map);


        /*
          Po załadowaniu PNG
          wymuszamy pixelated.
        */

        overlay.once(
          "load",
          () => {

            applyPixelRendering();

          }
        );


        /*
          Czasami element jest już dostępny
          natychmiast po addTo().
        */

        setTimeout(
          applyPixelRendering,
          0
        );


        if (fit) {

          map.fitBounds(
            bounds,
            {
              animate: false
            }
          );

        }


        coords.textContent =
          `x: -, y: -, z: ${currentFloor}`;

      }


      /*
        FLOOR SELECT
      */

      floorSelect.addEventListener(
        "change",
        event => {

          loadFloor(
            Number(
              event.target.value
            )
          );

        }
      );


      /*
        FLOOR -
      */

      document
        .getElementById(
          "prevFloor"
        )
        .addEventListener(
          "click",
          () => {

            const index =
              floors.indexOf(
                currentFloor
              );

            if (index > 0) {

              const newFloor =
                floors[
                  index - 1
                ];

              floorSelect.value =
                newFloor;

              loadFloor(
                newFloor
              );

            }

          }
        );


      /*
        FLOOR +
      */

      document
        .getElementById(
          "nextFloor"
        )
        .addEventListener(
          "click",
          () => {

            const index =
              floors.indexOf(
                currentFloor
              );

            if (
              index <
              floors.length - 1
            ) {

              const newFloor =
                floors[
                  index + 1
                ];

              floorSelect.value =
                newFloor;

              loadFloor(
                newFloor
              );

            }

          }
        );


      /*
        KOORDYNATY
      */

      map.on(
        "mousemove",
        event => {

          const floor =
            getFloorMeta(
              currentFloor
            );


          const pixelX =
            Math.floor(
              event.latlng.lng
            );

          const pixelY =
            Math.floor(
              event.latlng.lat
            );


          if (
            pixelX < 0 ||
            pixelY < 0 ||
            pixelX >= floor.width ||
            pixelY >= floor.height
          ) {

            coords.textContent =
              `x: -, y: -, z: ${currentFloor}`;

            return;

          }


          const gameX =
            floor.min_x +
            pixelX;

          const gameY =
            floor.min_y +
            pixelY;


          coords.textContent =
            `x: ${gameX}, y: ${gameY}, z: ${currentFloor}`;

        }
      );


      /*
        Kliknięcie:
        wypisz coords do konsoli.
      */

      map.on(
        "click",
        event => {

          const floor =
            getFloorMeta(
              currentFloor
            );


          const pixelX =
            Math.floor(
              event.latlng.lng
            );

          const pixelY =
            Math.floor(
              event.latlng.lat
            );


          if (
            pixelX < 0 ||
            pixelY < 0 ||
            pixelX >= floor.width ||
            pixelY >= floor.height
          ) {
            return;
          }


          const gameX =
            floor.min_x +
            pixelX;

          const gameY =
            floor.min_y +
            pixelY;


          console.log({
            x: gameX,
            y: gameY,
            z: currentFloor
          });

        }
      );


      /*
        Przy każdym zoomie jeszcze raz
        wymuszamy pixelated.

        Leaflet aktualizuje transform obrazu,
        więc robimy to profilaktycznie.
      */

      map.on(
        "zoomend",
        () => {

          applyPixelRendering();

        }
      );


      /*
        START
      */

      loadFloor(
        currentFloor,
        true
      );

    }


    init().catch(error => {

      console.error(error);

      document.getElementById(
        "map"
      ).innerHTML = `

        <div style="
          padding: 20px;
          color: red;
        ">

          Cannot load map.

          <br><br>

          ${error}

        </div>

      `;

    });

  </script>

</body>
</html>
