  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    #toolbar {
      height: 50px;
      display: flex;
      align-items: center;
      padding: 0 15px;
      box-sizing: border-box;
      background: #1a1a1a;
      position: relative;
      z-index: 1000;
      border-bottom: 1px solid #2b2b2b;
    }

    #toolbarLeft {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #layout {
      width: 100%;
      height: calc(100% - 50px);
      display: flex;
      min-height: 0;
    }

    #map {
      flex: 1;
      height: 100%;
      background: #000;
    }

    #sidePanel {
      width: 320px;
      min-width: 320px;
      max-width: 320px;
      height: 100%;
      background: #151515;
      border-left: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    #panelHeader {
      padding: 12px;
      border-bottom: 1px solid #2a2a2a;
    }

    #panelTitle {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #panelControls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filterRow {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .filterCount {
      color: #888;
      margin-left: 3px;
    }

    #coordList {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      box-sizing: border-box;
    }

    .coordItem {
      width: 100%;
      text-align: left;
      margin: 0 0 6px 0;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #333;
      border-radius: 6px;
      background: #1d1d1d;
      color: white;
      cursor: pointer;
      font-size: 13px;
      line-height: 1.35;
    }

    .coordItem:hover {
      background: #2a2a2a;
      border-color: #555;
    }

    .coordItem.active {
      border-color: #c78b1b;
      background: #35260a;
    }

    .coordLineTop {
      font-weight: bold;
      color: #ffd36b;
    }

    .coordLineBottom {
      color: #ccc;
      font-family: monospace;
      margin-top: 3px;
    }

    .groupTitle {
      padding: 8px 4px;
      font-weight: bold;
      color: #ddd;
      border-bottom: 1px solid #333;
      margin-bottom: 6px;
      margin-top: 6px;
    }

    select,
    button {
      background: #222;
      color: white;
      border: 1px solid #555;
      padding: 6px 10px;
      cursor: pointer;
    }

    button:hover,
    select:hover {
      background: #333;
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #coords {
      margin-left: auto;
      font-family: monospace;
      white-space: nowrap;
    }

    a {
      color: #00d4ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    #rashidInfo {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      white-space: nowrap;
      pointer-events: none;
    }

    #rashidSprite {
      width: 32px;
      height: 32px;
      object-fit: contain;

      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }

    #rashidText {
      font-size: 14px;
      color: #ffd36b;
    }

    .leaflet-image-layer,
    .leaflet-pane img,
    .pixelated-icon {
      image-rendering: crisp-edges !important;
      image-rendering: pixelated !important;
    }

    .leaflet-container {
      background: #000;
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: #1f1f1f;
      color: white;
    }

    @media (max-width: 1000px) {
      #sidePanel {
        width: 260px;
        min-width: 260px;
        max-width: 260px;
      }

      #rashidInfo {
        display: none;
      }
    }

    /*

      RASHID
      ==============================
    */

    function getRashidCity() {

      const day =
        new Date().getDay();


      const schedule = {

        0: "Carlin",
        1: "Thais",
        2: "Venore",
        3: "Ab'Dendriel",
        4: "Ankrahmun",
        5: "Darashia",
        6: "Edron"

      };


      return schedule[day] || "-";

    }


    function updateRashid() {

      rashidText.textContent =
        `Today Rashid is in: ${getRashidCity()}`;

    }


    /*
      ==============================
      MAP HELPERS
      ==============================
    */

    function getFloorMeta(z) {

      return meta.floors[
        String(z)
      ];

    }


    function getBounds(z) {

      const floor =
        getFloorMeta(z);


      return [

        [0, 0],

        [
          floor.height,
          floor.width
        ]

      ];

    }


    function applyPixelRendering() {

      if (!overlay) {
        return;
      }


      const image =
        overlay.getElement();


      if (!image) {
        return;
      }


      image.style.imageRendering =
        "pixelated";

      image.style.transition =
        "none";

    }


    function updateFloorButtons() {

      const index =
        floors.indexOf(
          currentFloor
        );


      prevFloorButton.disabled =
        index ===
        floors.length - 1;


      nextFloorButton.disabled =
        index === 0;

    }


    /*
      Tibia coordinate -> map coordinate
    */

    function gameToLeaflet(
      x,
      y,
      z
    ) {

      const floor =
        getFloorMeta(z);


      if (!floor) {
        return null;
      }


      const pixelX =
        x - floor.min_x;


      const pixelY =
        y - floor.min_y;


      return {

        lng:
          pixelX + 0.5,

        lat:
          pixelY + 0.5

      };

    }


    function isInsideFloor(
      x,
      y,
      z
    ) {

      const floor =
        getFloorMeta(z);


      if (!floor) {
        return false;
      }


      return (

        x >= floor.min_x &&
        x <= floor.max_x &&

        y >= floor.min_y &&
        y <= floor.max_y

      );

    }


    function centerOnGameCoordinate(
      x,
      y,
      z,
      zoom = 5
    ) {

      const point =
        gameToLeaflet(
          x,
          y,
          z
        );


      if (!point) {
        return;
      }


      map.setView(

        [
          point.lat,
          point.lng
        ],

        zoom,

        {
          animate: false
        }

      );

    }


    /*
      ==============================
      MINING ICONS
      ==============================
    */

    function createMiningIcon(
      type
    ) {

      const config =
        MINING_TYPES[type];


      const width =
        config.iconSize[0];

      const height =
        config.iconSize[1];


      return L.icon({

        iconUrl:
          `${config.icon}?v=${MAP_VERSION}`,

        iconSize:
          [width, height],

        iconAnchor:
          [
            width / 2,
            height / 2
          ],

        popupAnchor:
          [
            0,
            -(height / 2)
          ],

        className:
          "pixelated-icon"

      });

    }


    function renderMiningMarkers() {

      if (!miningLayer) {
        return;
      }


      miningLayer.clearLayers();


      Object.entries(
        MINING_TYPES
      ).forEach(
        ([type, config]) => {


          /*
            Checkbox off:
            don't draw this type
          */

          if (
            !config.checkbox.checked
          ) {
            return;
          }


          const icon =
            createMiningIcon(type);


          config.points
            .filter(
              point =>
                point.z ===
                currentFloor
            )
            .forEach(
              point => {


                if (
                  !isInsideFloor(
                    point.x,
                    point.y,
                    point.z
                  )
                ) {
                  return;
                }


                const leafletPoint =
                  gameToLeaflet(
                    point.x,
                    point.y,
                    point.z
                  );


                if (
                  !leafletPoint
                ) {
                  return;
                }


                const marker =
                  L.marker(

                    [
                      leafletPoint.lat,
                      leafletPoint.lng
                    ],

                    {

                      icon:
                        icon,

                      zIndexOffset:
                        1000

                    }

                  );


                marker.bindPopup(`

                  <strong>
                    ${config.label}
                  </strong>

                  <br>

                  x: ${point.x}

                  <br>

                  y: ${point.y}

                  <br>

                  z: ${point.z}

                `);


                marker.on(
                  "click",
                  () => {

                    highlightListEntry(
                      type,
                      point
                    );

                  }
                );


                miningLayer.addLayer(
                  marker
                );

              }
            );

        }
      );

    }


    /*
      ==============================
      LIST
      ==============================
    */

    function highlightListEntry(
      type,
      point
    ) {

      const items =
        coordList.querySelectorAll(
          ".coordItem"
        );


      items.forEach(
        item => {

          const same =

            item.dataset.type === type &&

            Number(
              item.dataset.x
            ) === point.x &&

            Number(
              item.dataset.y
            ) === point.y &&

            Number(
              item.dataset.z
            ) === point.z;


          item.classList.toggle(
            "active",
            same
          );

        }
      );

    }


    function goToMiningPoint(
      type,
      point
    ) {

      if (
        point.z !==
        currentFloor
      ) {

        loadFloor(

          point.z,

          false,

          () => {

            centerOnGameCoordinate(
              point.x,
              point.y,
              point.z,
              5
            );


            highlightListEntry(
              type,
              point
            );

          }

        );

      }

      else {

        centerOnGameCoordinate(
          point.x,
          point.y,
          point.z,
          5
        );


        highlightListEntry(
          type,
          point
        );

      }

    }


    function renderMiningList() {

      coordList.innerHTML =
        "";


      let somethingVisible =
        false;


      Object.entries(
        MINING_TYPES
      ).forEach(
        ([type, config]) => {


          if (
            !config.checkbox.checked
          ) {
            return;
          }


          somethingVisible =
            true;


          const groupTitle =
            document.createElement(
              "div"
            );


          groupTitle.className =
            "groupTitle";


          groupTitle.textContent =
            `${config.plural} (${config.points.length})`;


          coordList.appendChild(
            groupTitle
          );


          const sorted =
            [...config.points]
              .sort(
                (a, b) => {

                  if (
                    a.z !== b.z
                  ) {
                    return a.z - b.z;
                  }

                  if (
                    a.y !== b.y
                  ) {
                    return a.y - b.y;
                  }

                  return a.x - b.x;

                }
              );


          sorted.forEach(
            (point, index) => {


              const button =
                document.createElement(
                  "button"
                );


              button.className =
                "coordItem";


              button.dataset.type =
                type;


              button.dataset.x =
                point.x;

              button.dataset.y =
                point.y;

              button.dataset.z =
                point.z;


              button.innerHTML = `

                <div
                  class="coordLineTop"
                >

                  ${config.label}
                  #${index + 1}

                </div>


                <div
                  class="coordLineBottom"
                >

                  x: ${point.x},
                  y: ${point.y},
                  z: ${point.z}

                </div>

              `;


              button.addEventListener(
                "click",
                () => {

                  goToMiningPoint(
                    type,
                    point
                  );

                }
              );


              coordList.appendChild(
                button
              );

            }
          );

        }
      );


      if (
        !somethingVisible
      ) {

        coordList.innerHTML = `

          <div
            style="
              padding: 10px;
              color: #888;
              font-size: 13px;
            "
          >

            No filters selected.

          </div>

        `;

      }

    }


    /*
      ==============================
      FLOOR
      ==============================
    */

    function loadFloor(
      z,
      fit = false,
      afterLoad = null
    ) {

      z =
        Number(z);


      if (
        !meta.floors[
          String(z)
        ]
      ) {

        console.warn(
          `Floor ${z} does not exist`
        );

        return;

      }


      currentFloor =
        z;


      floorSelect.value =
        String(
          currentFloor
        );


      const floor =
        getFloorMeta(
          currentFloor
        );


      const bounds =
        getBounds(
          currentFloor
        );


      if (overlay) {

        map.removeLayer(
          overlay
        );

        overlay =
          null;

      }


      const imageUrl =
        `./export/${floor.file}?v=${MAP_VERSION}`;


      overlay =
        L.imageOverlay(

          imageUrl,

          bounds,

          {

            interactive:
              false,

            opacity:
              1

          }

        );


      overlay.addTo(
        map
      );


      overlay.once(
        "load",
        () => {


          applyPixelRendering();


          renderMiningMarkers();


          if (
            typeof afterLoad ===
            "function"
          ) {

            afterLoad();

          }

        }
      );


      overlay.once(
        "error",
        error => {

          console.error(
            `Cannot load floor ${currentFloor}`,
            error
          );

        }
      );


      if (fit) {

        map.fitBounds(

          bounds,

          {
            animate: false
          }

        );

      }


      coords.textContent =
        `x: -, y: -, z: ${currentFloor}`;


      updateFloorButtons();


      renderMiningMarkers();

    }


    /*
      ==============================
      INIT
      ==============================
    */

    async function init() {

      updateRashid();


      Object.entries(MINING_TYPES).forEach(([type, config]) => {
        const camelType = type.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
        const countElement = document.getElementById(`${camelType}Count`);

        if (countElement) {
          countElement.textContent = `(${config.points.length})`;
        }
      });


      const response =
        await fetch(

          `./export/map_info.json?v=${MAP_VERSION}`,

          {
            cache:
              "no-store"
          }

        );


      if (
        !response.ok
      ) {

        throw new Error(
          "Cannot load map_info.json"
        );

      }


      meta =
        await response.json();


      floors =
        Object.keys(
          meta.floors
        )
          .map(Number)
          .sort(
            (a, b) =>
              a - b
          );


      map =
        L.map(
          "map",
          {

            crs:
              L.CRS.Simple,

            minZoom:
              -4,

            maxZoom:
              10,

            zoomSnap:
              1,

            zoomDelta:
              1,

            wheelPxPerZoomLevel:
              120,

            zoomAnimation:
              false,

            fadeAnimation:
              false,

            markerZoomAnimation:
              false,

            attributionControl:
              false

          }
        );


      miningLayer =
        L.layerGroup()
          .addTo(map);


      floors.forEach(
        z => {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            z;


          option.textContent =
            `Floor ${z}`;


          floorSelect.appendChild(
            option
          );

        }
      );


      currentFloor =
        floors.includes(7)
          ? 7
          : floors[0];


      floorSelect.value =
        String(
          currentFloor
        );


      /*
        FLOOR SELECT
      */

      floorSelect
        .addEventListener(
          "change",
          event => {

            loadFloor(
              Number(
                event.target.value
              )
            );

          }
        );


      /*
        - = DOWN
      */

      prevFloorButton
        .addEventListener(
          "click",
          () => {

            const index =
              floors.indexOf(
                currentFloor
              );


            if (
              index >= 0 &&
              index <
              floors.length - 1
            ) {

              loadFloor(
                floors[
                  index + 1
                ]
              );

            }

          }
        );


      /*
        + = UP
      */

      nextFloorButton
        .addEventListener(
          "click",
          () => {

            const index =
              floors.indexOf(
                currentFloor
              );


            if (
              index > 0
            ) {

              loadFloor(
                floors[
                  index - 1
                ]
              );

            }

          }
        );


      /*
        FILTERS
      */

      Object.values(MINING_TYPES).forEach(config => {
        config.checkbox.addEventListener("change", () => {
          renderMiningMarkers();
          renderMiningList();
        });
      });


      /*
        COORDINATES
      */

      map.on(
        "mousemove",
        event => {

          const floor =
            getFloorMeta(
              currentFloor
            );


          const pixelX =
            Math.floor(
              event.latlng.lng
            );


          const pixelY =
            Math.floor(
              event.latlng.lat
            );


          if (

            pixelX < 0 ||
            pixelY < 0 ||

            pixelX >=
              floor.width ||

            pixelY >=
              floor.height

          ) {

            coords.textContent =
              `x: -, y: -, z: ${currentFloor}`;

            return;

          }


          const gameX =
            floor.min_x +
            pixelX;


          const gameY =
            floor.min_y +
            pixelY;


          coords.textContent =
            `x: ${gameX}, y: ${gameY}, z: ${currentFloor}`;

        }
      );


      map.on(
        "zoomend",
        () => {

          applyPixelRendering();

        }
      );


      /*
        START
      */

      renderMiningList();


      loadFloor(
        currentFloor,
        true
      );

    }


    init().catch(
      error => {

        console.error(
          error
        );


        document
          .getElementById(
            "map"
          )
          .innerHTML = `

            <div
              style="
                padding: 20px;
                color: red;
              "
            >

              Cannot load map.

              <br><br>

              ${error}

            </div>

          `;

      }
    );

  </script>

</body>
