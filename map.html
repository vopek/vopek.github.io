<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Miracle74 Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    #toolbar {
      height: 50px;
      display: flex;
      align-items: center;
      padding: 0 15px;
      box-sizing: border-box;
      background: #1a1a1a;
      position: relative;
      z-index: 1000;
    }

    #toolbarLeft {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #map {
      width: 100%;
      height: calc(100% - 50px);
      background: #000;
    }

    select,
    button {
      background: #222;
      color: white;
      border: 1px solid #555;
      padding: 6px 10px;
      cursor: pointer;
    }

    button:hover,
    select:hover {
      background: #333;
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #coords {
      margin-left: auto;
      font-family: monospace;
      white-space: nowrap;
    }

    a {
      color: #00d4ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    #rashidInfo {
      position: absolute;
      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      display: flex;
      align-items: center;
      gap: 8px;

      font-weight: bold;
      white-space: nowrap;
      pointer-events: none;
    }

    #rashidSprite {
      width: 32px;
      height: 32px;

      object-fit: contain;

      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }

    #rashidText {
      font-size: 14px;
      color: #ffd36b;
    }

    .leaflet-image-layer {
      image-rendering: crisp-edges !important;
      image-rendering: pixelated !important;
    }

    .leaflet-pane img {
      image-rendering: crisp-edges !important;
      image-rendering: pixelated !important;
    }

    .leaflet-container {
      background: #000;
    }

    @media (max-width: 800px) {
      #rashidInfo {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div id="toolbar">

    <div id="toolbarLeft">

      <a href="./index.html">
        ← Wiki
      </a>

      <label for="floorSelect">
        Floor:
      </label>

      <select id="floorSelect"></select>

      <button id="prevFloor">
        -
      </button>

      <button id="nextFloor">
        +
      </button>

    </div>


    <div id="rashidInfo">

      <img
        id="rashidSprite"
        src="./images/npc/rashid.gif"
        alt="Rashid"
      />

      <div id="rashidText">
        Today Rashid is in: -
      </div>

    </div>


    <div id="coords">
      x: -, y: -, z: -
    </div>

  </div>


  <div id="map"></div>


  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>


  <script>

    let map;
    let overlay;
    let meta;
    let currentFloor;
    let floors = [];


    const floorSelect =
      document.getElementById("floorSelect");

    const coords =
      document.getElementById("coords");

    const prevFloorButton =
      document.getElementById("prevFloor");

    const nextFloorButton =
      document.getElementById("nextFloor");

    const rashidText =
      document.getElementById("rashidText");


    /*
      Zmień po każdym nowym eksporcie map.
    */
    const MAP_VERSION = "20260905-5";


    /*
      Rashid schedule:

      Monday    - Thais
      Tuesday   - Venore
      Wednesday - Ab'Dendriel
      Thursday  - Ankrahmun
      Friday    - Darashia
      Saturday  - Edron
      Sunday    - Carlin
    */
    function getRashidCity() {

      const day =
        new Date().getDay();

      const schedule = {
        0: "Carlin",
        1: "Thais",
        2: "Venore",
        3: "Ab'Dendriel",
        4: "Ankrahmun",
        5: "Darashia",
        6: "Edron"
      };

      return schedule[day] || "-";

    }


    function updateRashid() {

      rashidText.textContent =
        `Today Rashid is in: ${getRashidCity()}`;

    }


    async function init() {

      updateRashid();


      const response = await fetch(
        `./export/map_info.json?v=${MAP_VERSION}`,
        {
          cache: "no-store"
        }
      );


      if (!response.ok) {

        throw new Error(
          "Cannot load ./export/map_info.json"
        );

      }


      meta =
        await response.json();


      floors =
        Object.keys(meta.floors)
          .map(Number)
          .sort((a, b) => a - b);


      map = L.map(
        "map",
        {
          crs: L.CRS.Simple,

          minZoom: -4,
          maxZoom: 10,

          zoomSnap: 1,
          zoomDelta: 1,

          wheelPxPerZoomLevel: 120,

          zoomAnimation: false,
          fadeAnimation: false,
          markerZoomAnimation: false,

          attributionControl: false
        }
      );


      /*
        Floor dropdown.
      */

      floors.forEach(
        z => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            z;

          option.textContent =
            `Floor ${z}`;

          floorSelect.appendChild(
            option
          );

        }
      );


      /*
        Start floor = 7.
      */

      currentFloor =
        floors.includes(7)
          ? 7
          : floors[0];


      floorSelect.value =
        String(currentFloor);


      function getFloorMeta(z) {

        return meta.floors[
          String(z)
        ];

      }


      function getBounds(z) {

        const floor =
          getFloorMeta(z);


        return [
          [0, 0],
          [
            floor.height,
            floor.width
          ]
        ];

      }


      function applyPixelRendering() {

        if (!overlay) {
          return;
        }


        const image =
          overlay.getElement();


        if (!image) {
          return;
        }


        image.style.imageRendering =
          "pixelated";

        image.style.transition =
          "none";

        image.style.willChange =
          "transform";

      }


      function updateFloorButtons() {

        const index =
          floors.indexOf(
            currentFloor
          );


        /*
          "-" = down
          higher Z
        */
        prevFloorButton.disabled =
          index ===
          floors.length - 1;


        /*
          "+" = up
          lower Z
        */
        nextFloorButton.disabled =
          index === 0;

      }


      function loadFloor(
        z,
        fit = false
      ) {

        z =
          Number(z);


        if (
          !meta.floors[
            String(z)
          ]
        ) {

          console.warn(
            `Floor ${z} does not exist`
          );

          return;

        }


        currentFloor =
          z;


        floorSelect.value =
          String(currentFloor);


        const floor =
          getFloorMeta(
            currentFloor
          );


        const bounds =
          getBounds(
            currentFloor
          );


        if (overlay) {

          map.removeLayer(
            overlay
          );

          overlay =
            null;

        }


        const imageUrl =
          `./export/${floor.file}?v=${MAP_VERSION}`;


        console.log(
          "Loading floor:",
          currentFloor,
          imageUrl
        );


        overlay =
          L.imageOverlay(
            imageUrl,
            bounds,
            {
              interactive: false,
              opacity: 1
            }
          );


        overlay.addTo(
          map
        );


        overlay.once(
          "load",
          () => {

            applyPixelRendering();

            console.log(
              `Loaded floor ${currentFloor}`
            );

          }
        );


        overlay.once(
          "error",
          error => {

            console.error(
              `Cannot load floor ${currentFloor}:`,
              imageUrl,
              error
            );

          }
        );


        setTimeout(
          applyPixelRendering,
          0
        );


        if (fit) {

          map.fitBounds(
            bounds,
            {
              animate: false
            }
          );

        }


        coords.textContent =
          `x: -, y: -, z: ${currentFloor}`;


        updateFloorButtons();

      }


      /*
        Select floor.
      */

      floorSelect.addEventListener(
        "change",
        event => {

          loadFloor(
            Number(
              event.target.value
            )
          );

        }
      );


      /*
        "-"

        down:
        7 -> 8
        8 -> 9
        ...
        15 -> 16
      */

      prevFloorButton.addEventListener(
        "click",
        () => {

          const index =
            floors.indexOf(
              currentFloor
            );


          if (
            index >= 0 &&
            index <
            floors.length - 1
          ) {

            const newFloor =
              floors[
                index + 1
              ];


            loadFloor(
              newFloor
            );

          }

        }
      );


      /*
        "+"

        up:
        7 -> 6
        6 -> 5
        ...
        1 -> 0
      */

      nextFloorButton.addEventListener(
        "click",
        () => {

          const index =
            floors.indexOf(
              currentFloor
            );


          if (
            index > 0
          ) {

            const newFloor =
              floors[
                index - 1
              ];


            loadFloor(
              newFloor
            );

          }

        }
      );


      /*
        Mouse coordinates.
      */

      map.on(
        "mousemove",
        event => {

          const floor =
            getFloorMeta(
              currentFloor
            );


          const pixelX =
            Math.floor(
              event.latlng.lng
            );


          const pixelY =
            Math.floor(
              event.latlng.lat
            );


          if (
            pixelX < 0 ||
            pixelY < 0 ||
            pixelX >= floor.width ||
            pixelY >= floor.height
          ) {

            coords.textContent =
              `x: -, y: -, z: ${currentFloor}`;

            return;

          }


          const gameX =
            floor.min_x +
            pixelX;


          const gameY =
            floor.min_y +
            pixelY;


          coords.textContent =
            `x: ${gameX}, y: ${gameY}, z: ${currentFloor}`;

        }
      );


      /*
        Click coordinates.
      */

      map.on(
        "click",
        event => {

          const floor =
            getFloorMeta(
              currentFloor
            );


          const pixelX =
            Math.floor(
              event.latlng.lng
            );


          const pixelY =
            Math.floor(
              event.latlng.lat
            );


          if (
            pixelX < 0 ||
            pixelY < 0 ||
            pixelX >= floor.width ||
            pixelY >= floor.height
          ) {

            return;

          }


          const gameX =
            floor.min_x +
            pixelX;


          const gameY =
            floor.min_y +
            pixelY;


          console.log(
            {
              x: gameX,
              y: gameY,
              z: currentFloor
            }
          );

        }
      );


      map.on(
        "zoomend",
        () => {

          applyPixelRendering();

        }
      );


      /*
        Start.
      */

      loadFloor(
        currentFloor,
        true
      );

    }


    init().catch(
      error => {

        console.error(
          error
        );


        document
          .getElementById(
            "map"
          )
          .innerHTML = `

            <div
              style="
                padding: 20px;
                color: red;
              "
            >

              Cannot load map.

              <br><br>

              ${error}

            </div>

          `;

      }
    );

  </script>

</body>
</html>
