<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Miracle74 Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    #toolbar {
      height: 50px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 15px;
      box-sizing: border-box;
      background: #1a1a1a;
      position: relative;
      z-index: 1000;
    }

    #map {
      width: 100%;
      height: calc(100% - 50px);
      background: #000;
    }

    select,
    button {
      background: #222;
      color: white;
      border: 1px solid #555;
      padding: 6px 10px;
      cursor: pointer;
    }

    button:hover,
    select:hover {
      background: #333;
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    #coords {
      margin-left: auto;
      font-family: monospace;
    }

    a {
      color: #00d4ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .leaflet-image-layer {
      image-rendering: crisp-edges !important;
      image-rendering: pixelated !important;
    }

    .leaflet-pane img {
      image-rendering: crisp-edges !important;
      image-rendering: pixelated !important;
    }

    .leaflet-container {
      background: #000;
    }
  </style>
</head>

<body>

  <div id="toolbar">
    <a href="./index.html">← Wiki</a>

    <label for="floorSelect">Floor:</label>

    <select id="floorSelect"></select>

    <button id="prevFloor">-</button>
    <button id="nextFloor">+</button>

    <div id="coords">
      x: -, y: -, z: -
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map;
    let overlay;
    let meta;
    let currentFloor;
    let floors = [];

    const floorSelect =
      document.getElementById("floorSelect");

    const coords =
      document.getElementById("coords");

    const prevFloorButton =
      document.getElementById("prevFloor");

    const nextFloorButton =
      document.getElementById("nextFloor");


    /*
      Zmień po każdym nowym eksporcie map.
    */
    const MAP_VERSION = "20260905-4";


    async function init() {

      const response = await fetch(
        `./export/map_info.json?v=${MAP_VERSION}`,
        {
          cache: "no-store"
        }
      );

      if (!response.ok) {
        throw new Error(
          "Cannot load ./export/map_info.json"
        );
      }

      meta = await response.json();


      /*
        Sortowanie floorów rosnąco:

        0, 1, 2, ...
        15, 16
      */
      floors = Object.keys(meta.floors)
        .map(Number)
        .sort((a, b) => a - b);


      map = L.map("map", {
        crs: L.CRS.Simple,

        minZoom: -4,
        maxZoom: 10,

        zoomSnap: 1,
        zoomDelta: 1,

        wheelPxPerZoomLevel: 120,

        zoomAnimation: false,
        fadeAnimation: false,
        markerZoomAnimation: false,

        attributionControl: false
      });


      /*
        Dropdown.
      */
      floors.forEach(z => {

        const option =
          document.createElement("option");

        option.value = z;
        option.textContent = `Floor ${z}`;

        floorSelect.appendChild(option);

      });


      /*
        Start na floor 7,
        jeśli istnieje.
      */
      currentFloor =
        floors.includes(7)
          ? 7
          : floors[0];

      floorSelect.value =
        String(currentFloor);


      function getFloorMeta(z) {
        return meta.floors[String(z)];
      }


      function getBounds(z) {
        const floor = getFloorMeta(z);

        return [
          [0, 0],
          [
            floor.height,
            floor.width
          ]
        ];
      }


      function applyPixelRendering() {

        if (!overlay) {
          return;
        }

        const image =
          overlay.getElement();

        if (!image) {
          return;
        }

        image.style.imageRendering =
          "pixelated";

        image.style.transition =
          "none";

        image.style.willChange =
          "transform";
      }


      /*
        Blokowanie przycisków
        na skrajnych floorach.

        Tibia:
        + = wyżej = mniejsze z
        - = niżej = większe z
      */
      function updateFloorButtons() {

        const index =
          floors.indexOf(currentFloor);

        /*
          "-" schodzi niżej,
          więc przy maksymalnym z
          już nie może dalej.
        */
        prevFloorButton.disabled =
          index === floors.length - 1;

        /*
          "+" idzie wyżej,
          więc przy z=0
          już nie może dalej.
        */
        nextFloorButton.disabled =
          index === 0;
      }


      function loadFloor(
        z,
        fit = false
      ) {

        z = Number(z);


        /*
          Zabezpieczenie przed undefined
          / nieistniejącym floorem.
        */
        if (!meta.floors[String(z)]) {

          console.warn(
            `Floor ${z} does not exist`
          );

          return;
        }


        currentFloor = z;

        floorSelect.value =
          String(currentFloor);


        const floor =
          getFloorMeta(currentFloor);

        const bounds =
          getBounds(currentFloor);


        if (overlay) {

          map.removeLayer(
            overlay
          );

          overlay = null;

        }


        const imageUrl =
          `./export/${floor.file}?v=${MAP_VERSION}`;


        console.log(
          "Loading floor:",
          currentFloor,
          imageUrl
        );


        overlay = L.imageOverlay(
          imageUrl,
          bounds,
          {
            interactive: false,
            opacity: 1
          }
        );


        overlay.addTo(map);


        overlay.once(
          "load",
          () => {

            applyPixelRendering();

            console.log(
              `Loaded floor ${currentFloor}`
            );

          }
        );


        overlay.once(
          "error",
          error => {

            console.error(
              `Cannot load floor ${currentFloor}:`,
              imageUrl,
              error
            );

          }
        );


        setTimeout(
          applyPixelRendering,
          0
        );


        if (fit) {

          map.fitBounds(
            bounds,
            {
              animate: false
            }
          );

        }


        coords.textContent =
          `x: -, y: -, z: ${currentFloor}`;


        updateFloorButtons();
      }


      /*
        Zmiana floora przez select.
      */
      floorSelect.addEventListener(
        "change",
        event => {

          loadFloor(
            Number(
              event.target.value
            )
          );

        }
      );


      /*
        "-"

        Tibia:
        większe z = niżej

        7 -> 8
        8 -> 9
        ...
        15 -> 16
      */
      prevFloorButton.addEventListener(
        "click",
        () => {

          const index =
            floors.indexOf(currentFloor);


          if (
            index >= 0 &&
            index < floors.length - 1
          ) {

            const newFloor =
              floors[index + 1];

            loadFloor(
              newFloor
            );

          }

        }
      );


      /*
        "+"

        Tibia:
        mniejsze z = wyżej

        7 -> 6
        6 -> 5
        ...
        1 -> 0
      */
      nextFloorButton.addEventListener(
        "click",
        () => {

          const index =
            floors.indexOf(currentFloor);


          if (index > 0) {

            const newFloor =
              floors[index - 1];

            loadFloor(
              newFloor
            );

          }

        }
      );


      /*
        Współrzędne pod kursorem.
      */
      map.on(
        "mousemove",
        event => {

          const floor =
            getFloorMeta(currentFloor);


          const pixelX =
            Math.floor(
              event.latlng.lng
            );

          const pixelY =
            Math.floor(
              event.latlng.lat
            );


          if (
            pixelX < 0 ||
            pixelY < 0 ||
            pixelX >= floor.width ||
            pixelY >= floor.height
          ) {

            coords.textContent =
              `x: -, y: -, z: ${currentFloor}`;

            return;
          }


          const gameX =
            floor.min_x +
            pixelX;

          const gameY =
            floor.min_y +
            pixelY;


          coords.textContent =
            `x: ${gameX}, y: ${gameY}, z: ${currentFloor}`;

        }
      );


      /*
        Kliknięcie na mapę.
      */
      map.on(
        "click",
        event => {

          const floor =
            getFloorMeta(currentFloor);


          const pixelX =
            Math.floor(
              event.latlng.lng
            );

          const pixelY =
            Math.floor(
              event.latlng.lat
            );


          if (
            pixelX < 0 ||
            pixelY < 0 ||
            pixelX >= floor.width ||
            pixelY >= floor.height
          ) {
            return;
          }


          const gameX =
            floor.min_x +
            pixelX;

          const gameY =
            floor.min_y +
            pixelY;


          console.log({
            x: gameX,
            y: gameY,
            z: currentFloor
          });

        }
      );


      map.on(
        "zoomend",
        () => {

          applyPixelRendering();

        }
      );


      /*
        Start.
      */
      loadFloor(
        currentFloor,
        true
      );
    }


    init().catch(error => {

      console.error(error);

      document.getElementById(
        "map"
      ).innerHTML = `
        <div style="
          padding: 20px;
          color: red;
        ">
          Cannot load map.

          <br><br>

          ${error}
        </div>
      `;

    });
  </script>

</body>
</html>
